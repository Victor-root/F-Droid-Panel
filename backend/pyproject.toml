[project]
name = "fdroid-panel"
dynamic = ["version"]
description = "Self-hosted web dashboard to manage F-Droid repositories"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "fastapi>=0.153.0",
    "pyotp>=2.10.0",
    "ruamel-yaml>=0.17.22",
    "segno>=1.6.6",
    "sqlalchemy>=2.0.55",
    "tomli>=2 ; python_full_version < '3.11'",
    "uvicorn>=0.54.0",
]

[project.scripts]
fdroid-panel = "fdroid_panel.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "tomli>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fdroid_panel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fdroid_panel"]
# The built interface is copied to static/ by tools/release/build.sh; git ignores it.
artifacts = ["src/fdroid_panel/static/**"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# French texts use the typographic apostrophe.
allowed-confusables = ["’"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

# Imported only by data/inspect_apk.py, which runs with the Python of fdroidserver.
[[tool.mypy.overrides]]
module = ["loguru", "androguard.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
