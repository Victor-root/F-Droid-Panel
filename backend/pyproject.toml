[project]
name = "fdroid-panel"
dynamic = ["version"]
description = "Self-hosted web dashboard to manage F-Droid repositories"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.153.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.14.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fdroid_panel/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fdroid_panel"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
