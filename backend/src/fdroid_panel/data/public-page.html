<!doctype html>
<html lang="$language">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>$title</title>
<style nonce="$nonce">
:root {
  --accent: $accent;
  --bg: #f5f7f6;
  --surface: #fff;
  --text: #18201b;
  --muted: #5b665f;
  --border: #e2e8e4;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111513; --surface: #1a1f1c; --text: #eef2ef; --muted: #a3ada6; --border: #2c342f; }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 15px/1.55 system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  background-image: radial-gradient(60rem 30rem at 85% -10%, color-mix(in oklab, var(--accent) 22%, transparent), transparent);
}
main { max-width: 44rem; margin: 0 auto; padding: 3rem 1rem; display: grid; gap: 1.5rem; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 1.25rem;
  padding: 1.75rem;
  box-shadow: 0 2px 6px rgb(0 0 0 / 0.05), 0 18px 40px rgb(0 0 0 / 0.06);
}
header { display: flex; gap: 1rem; align-items: center; }
header img { border-radius: 1rem; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.05rem; margin: 0 0 0.25rem; }
.muted { color: var(--muted); margin: 0.1rem 0; }
.add {
  display: flex;
  gap: 1.25rem;
  align-items: center;
  flex-wrap: wrap;
  margin: 1.25rem 0;
  padding: 1rem;
  border-radius: 1rem;
  background: color-mix(in oklab, var(--accent) 10%, var(--surface));
}
.qr svg { display: block; border-radius: 0.75rem; max-width: 11rem; height: auto; }
.add > div:last-child { flex: 1; min-width: 14rem; }
.button {
  display: inline-block;
  margin-top: 0.6rem;
  padding: 0.55rem 0.9rem;
  border-radius: 0.75rem;
  background: var(--accent);
  color: #111;
  font-weight: 600;
  text-decoration: none;
  word-break: break-all;
}
dl { margin: 0; display: grid; gap: 0.25rem; }
dt { font-size: 0.8rem; color: var(--muted); }
dd { margin: 0 0 0.5rem; }
code { font: 12px/1.5 ui-monospace, monospace; word-break: break-all; }
.note { padding: 0.75rem 1rem; border-radius: 0.75rem; background: color-mix(in oklab, #f59e0b 14%, var(--surface)); }
footer { text-align: center; color: var(--muted); font-size: 0.8rem; }
</style>
</head>
<body>
<main>
$body
<footer>$footer</footer>
</main>
</body>
</html>
