<section class="card">
  <header>
    <img src="$icon" alt="" width="56" height="56">
    <div><h1>$name</h1><p class="muted">$apps</p></div>
  </header>
  <p>$description</p>
  $private
  <div class="add">
    <div class="qr">$qr</div>
    <div>
      <h2>$add_title</h2>
      <p class="muted">$scan</p>
      <a class="button" href="$add_url">$repo_url</a>
    </div>
  </div>
  <dl>
    <dt>$address_label</dt><dd><code>$repo_url</code></dd>
    $fingerprint
  </dl>
</section>
