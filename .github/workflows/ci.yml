name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # A GitHub machine sometimes hangs while installing packages: a stuck job fails after 30 minutes
  # instead of the default 6 hours. The longest jobs take about 11 minutes.
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: No em dash
        run: python3 tools/checks/check_no_em_dash.py
      - name: Translations complete
        run: |
          python3 tools/checks/check_i18n.py
          python3 tools/checks/check_install_sh.py
      - name: Shell scripts
        run: |
          bash -n install.sh
          shellcheck install.sh tools/release/build.sh tools/installer/test-in-container.sh

  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check . ../tools
          uv run ruff format --check . ../tools
      - name: Type check
        run: |
          uv run mypy
          uv run mypy --strict ../tools
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: astral-sh/setup-uv@v7
      - name: End to end tests against the real backend
        run: |
          (cd ../backend && uv sync --locked)
          npx playwright install --with-deps chromium
          npm run e2e

  fixtures:
    name: fdroidserver ${{ matrix.fdroidserver.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        fdroidserver:
          - name: managed (locked)
            install: pip install --require-hashes -r packaging/fdroidserver/requirements.txt
          # Oldest supported version. Versions before 2.4.5 break with androguard 4.1.4.
          - name: "2.4.0"
            install: pip install fdroidserver==2.4.0 androguard==4.1.3
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            aapt zipalign apksigner android-sdk-platform-23 default-jdk-headless git python3-venv
      - name: fdroidserver
        run: |
          python3 -m venv /tmp/fdroid-venv
          /tmp/fdroid-venv/bin/${{ matrix.fdroidserver.install }}
      - name: Build and check fixture repositories
        run: python3 tools/fixtures/make_repos.py --out /tmp/fixtures --fdroid /tmp/fdroid-venv/bin/fdroid
      - uses: astral-sh/setup-uv@v7
      - name: Backend tests against the real fdroidserver
        working-directory: backend
        env:
          FDROID_PANEL_TEST_FDROID: /tmp/fdroid-venv/bin/fdroid
          FDROID_PANEL_TEST_FIXTURES: /tmp/fixtures
        run: |
          uv sync --locked
          uv run pytest

  release:
    name: Release archive
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v7
      - name: Build
        run: tools/release/build.sh dist
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: dist/

  installer:
    name: install.sh on ${{ matrix.image }} (${{ matrix.arch }})
    needs: release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04"]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      - name: Install, update with rollback, uninstall
        run: tools/installer/test-in-container.sh "${{ matrix.image }}" dist

  publish:
    name: Publish the release
    needs: [checks, backend, frontend, fixtures, installer]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: dist
      # main only receives finished work, so each push to it is the release install.sh offers. Pushing
      # again without changing the version replaces the release of that version. A run that finishes
      # after a newer push publishes nothing: it would replace the newer release with an older one.
      - name: Release
        run: |
          head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "main is now at ${head}, the run of that commit publishes it"
            exit 0
          fi
          version="$(sed -n 's/^version=//p' <(tar -xzf dist/fdroid-panel.tar.gz -O fdroid-panel/RELEASE))"
          gh release delete "v${version}" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create "v${version}" dist/fdroid-panel.tar.gz dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --latest --title "F-Droid Panel ${version}" \
            --notes "Built from ${GITHUB_SHA} on main, after every check passed."
