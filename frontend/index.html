<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>F-Droid Panel</title>
    <script>
      (function () {
        try {
          var root = document.documentElement;
          var mode = localStorage.getItem("fdroid-panel:theme");
          var dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          root.classList.toggle("dark", dark);
          var palette = JSON.parse(localStorage.getItem("fdroid-panel:palette") || "null");
          var variables = palette && palette[dark ? "dark" : "light"];
          for (var name in variables) root.style.setProperty(name, variables[name]);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
